name: AI Team Runner (Abdulaziz & Nova)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  run-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # أمان: لا يشتغل إلا إذا كان صاحب الريبو هو الفاعل، حتى لا يستهلك غريب مفاتيحك
    if: >
      github.actor == github.repository_owner &&
      github.actor != 'github-actions[bot]' &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@nova') || contains(github.event.issue.body, '@nova'))
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install anthropic groq requests

      - name: Execute Agent Task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEXT_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os, requests
          from anthropic import Anthropic
          from groq import Groq

          text = os.environ.get("TEXT_BODY", "")
          repo = os.environ.get("GITHUB_REPOSITORY")
          issue_num = os.environ.get("ISSUE_NUMBER")
          gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
          anthropic_key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          groq_key = os.environ.get("GROQ_API_KEY", "").strip()

          reply = ""

          # تشغيل عبدالعزيز عبر Claude
          if "@claude" in text:
              if not anthropic_key:
                  reply += "⚠️ مفتاح ANTHROPIC_API_KEY غير مضاف في Secrets.\n\n"
              else:
                  client = Anthropic(api_key=anthropic_key)
                  models_to_try = ["claude-sonnet-5-5", "claude-haiku-5-5", "claude-sonnet-4-6"]
                  for m in models_to_try:
                      try:
                          res = client.messages.create(
                              model=m,
                              max_tokens=1500,
                              system="أنت 'عبدالعزيز'، كبير المهندسين ومدير العمليات التقنية. اكتب أكواداً نظيفة وجاهزة للتشغيل وهياكل منصات احترافية باختصار وتركيز دون مقدمات طويلة.",
                              messages=[{"role": "user", "content": text}]
                          )
                          reply += f"👨‍💻 **عبدالعزيز (العمليات والتقنية):**\n\n{res.content[0].text}\n\n---\n"
                          break
                      except Exception as e:
                          print(f"Model {m} error: {type(e).__name__}")

          # تشغيل نوفا عبر Groq
          if "@nova" in text:
              if not groq_key:
                  reply += "⚠️ مفتاح GROQ_API_KEY غير مضاف في Secrets.\n\n"
              else:
                  try:
                      g_client = Groq(api_key=groq_key)
                      chat = g_client.chat.completions.create(
                          model="llama-3.3-70b-versatile",
                          max_tokens=1024,
                          messages=[
                              {"role": "system", "content": "أنتِ 'نوفا'، مديرة أعمال وتسويق بلهجة وشخصية لبنانية راقية، ذكية، وعملية جداً. مهمتك اقتناص الفرص، التسويق للمنصات، وصياغة الخطط والرسائل البيعية باختصار واحترافية."},
                              {"role": "user", "content": text}
                          ]
                      )
                      reply += f"✨ **نوفا (مديرة الأعمال والتسويق):**\n\n{chat.choices[0].message.content}\n"
                  except Exception as e:
                      reply += f"⚠️ خطأ في اتصال نوفا (Groq): {type(e).__name__}\n"

          if reply:
              url = f"https://api.github.com/repos/{repo}/issues/{issue_num}/comments"
              headers = {"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"}
              r = requests.post(url, json={"body": reply}, headers=headers)
              print("GitHub Comment Status:", r.status_code)
          EOF
